[workspace]
resolver = "3"
members = [
    "book_outputs",
    "ww_crc",
    "ww_date_time",
    "ww_error",
    "ww_global",
    "ww_keyed",
    "ww_numeric",
    "ww_si",
    "ww_version",
]

[workspace.package]
authors = ["Roman Isaikin <romix.lab@gmail.com>"]
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/vhrdtech/ww_base"
license = "MIT"

[workspace.dependencies]
# the wire format and the units, each in its own repository, taken by git: Cargo.lock pins the commit
# (`cargo update -p shrink_wrap` moves it); to develop one alongside, a [patch] in an uncommitted .cargo/config.toml
exact_units = { version = "0.1.0", git = "https://github.com/romixlab/exact_units", default-features = false }
shrink_wrap = { version = "0.2.0", git = "https://github.com/romixlab/shrink_wrap", default-features = false }

# the crates of this repository, each with its own version
book_outputs = { path = "./book_outputs" }
ww_numeric = { version = "0.3.0", path = "./ww_numeric", default-features = false }
ww_si = { version = "0.5.0", path = "./ww_si", default-features = false }
ww_version = { version = "0.2.0", path = "./ww_version", default-features = false }

chrono = { version = "0.4", default-features = false }
convert_case = "0.11"
crc = "3.4"
defmt = "1.1"
hex = { version = "0.4", default-features = false }
hex-literal = "1"
proptest = "1.11"
semver = { version = "1.0", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unused_lifetimes = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"

[profile.dev]
debug = false
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
split-debuginfo = "unpacked"

[profile.deploy]
inherits = "release"
incremental = true
